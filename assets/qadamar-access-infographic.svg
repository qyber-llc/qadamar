<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c211c"/><stop offset="1" stop-color="#050b0a"/></linearGradient><radialGradient id="glow"><stop stop-color="#3ee3a4" stop-opacity=".17"/><stop offset="1" stop-color="#3ee3a4" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="900" rx="40" fill="url(#bg)"/><ellipse cx="820" cy="460" rx="680" ry="400" fill="url(#glow)"/><g font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif"><text x="88" y="98" fill="#88bca7" font-size="23" letter-spacing="3">QADAMAR / QYBER LLC</text><text x="88" y="176" fill="#fff" font-size="62" font-weight="600" letter-spacing="-2">Every check. One clear decision.</text><text x="88" y="224" fill="#b4c6be" font-size="25">A request passes every stage. Any refusal means access is denied.</text><path d="M160 405H1440M1440 405V640H160" fill="none" stroke="#447762" stroke-width="3"/><text x="88" y="832" fill="#a5beb1" font-size="22">Subject + action + resource + context</text><rect x="1050" y="774" width="180" height="60" rx="30" fill="#193d2f" stroke="#398762"/><text x="1140" y="813" fill="#8df0bc" text-anchor="middle" font-size="23">All pass: allow</text><rect x="1250" y="774" width="262" height="60" rx="30" fill="#342020" stroke="#865550"/><text x="1381" y="813" fill="#ffc2b6" text-anchor="middle" font-size="23">Any refusal: deny</text><circle cx="160" cy="405" r="40" fill="#102d23" stroke="#4fa880" stroke-width="2"/><path d="M148 405l8 8 17-19" fill="none" stroke="#8df0bc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="328" text-anchor="middle" font-size="24" font-weight="600" fill="#f5faf7">Validation</text><text x="160" y="484" text-anchor="middle" font-size="19" fill="#a9bdb3">A complete request</text><circle cx="480" cy="405" r="40" fill="#102d23" stroke="#4fa880" stroke-width="2"/><path d="M468 405l8 8 17-19" fill="none" stroke="#8df0bc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="328" text-anchor="middle" font-size="24" font-weight="600" fill="#f5faf7">Active identity</text><text x="480" y="484" text-anchor="middle" font-size="19" fill="#a9bdb3">Still permitted to act</text><circle cx="800" cy="405" r="40" fill="#102d23" stroke="#4fa880" stroke-width="2"/><path d="M788 405l8 8 17-19" fill="none" stroke="#8df0bc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="328" text-anchor="middle" font-size="24" font-weight="600" fill="#f5faf7">Eligibility</text><text x="800" y="484" text-anchor="middle" font-size="19" fill="#a9bdb3">A qualifying role or rule</text><circle cx="1120" cy="405" r="40" fill="#102d23" stroke="#4fa880" stroke-width="2"/><path d="M1108 405l8 8 17-19" fill="none" stroke="#8df0bc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1120" y="328" text-anchor="middle" font-size="24" font-weight="600" fill="#f5faf7">Mandatory controls</text><text x="1120" y="484" text-anchor="middle" font-size="19" fill="#a9bdb3">Clearance and integrity</text><circle cx="1440" cy="405" r="40" fill="#102d23" stroke="#4fa880" stroke-width="2"/><path d="M1428 405l8 8 17-19" fill="none" stroke="#8df0bc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1440" y="328" text-anchor="middle" font-size="24" font-weight="600" fill="#f5faf7">Need-to-know</text><text x="1440" y="484" text-anchor="middle" font-size="19" fill="#a9bdb3">The right relationship</text><circle cx="1120" cy="640" r="40" fill="#102d23" stroke="#4fa880" stroke-width="2"/><path d="M1108 640l8 8 17-19" fill="none" stroke="#8df0bc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1120" y="563" text-anchor="middle" font-size="24" font-weight="600" fill="#f5faf7">Policy</text><text x="1120" y="719" text-anchor="middle" font-size="19" fill="#a9bdb3">Rules and obligations</text><circle cx="800" cy="640" r="40" fill="#102d23" stroke="#4fa880" stroke-width="2"/><path d="M788 640l8 8 17-19" fill="none" stroke="#8df0bc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="563" text-anchor="middle" font-size="24" font-weight="600" fill="#f5faf7">Context</text><text x="800" y="719" text-anchor="middle" font-size="19" fill="#a9bdb3">Time, network, device</text><circle cx="480" cy="640" r="40" fill="#102d23" stroke="#4fa880" stroke-width="2"/><path d="M468 640l8 8 17-19" fill="none" stroke="#8df0bc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="563" text-anchor="middle" font-size="24" font-weight="600" fill="#f5faf7">Certified commands</text><text x="480" y="719" text-anchor="middle" font-size="19" fill="#a9bdb3">A controlled path</text><circle cx="160" cy="640" r="40" fill="#102d23" stroke="#4fa880" stroke-width="2"/><path d="M148 640l8 8 17-19" fill="none" stroke="#8df0bc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="563" text-anchor="middle" font-size="24" font-weight="600" fill="#f5faf7">Separation of duties</text><text x="160" y="719" text-anchor="middle" font-size="19" fill="#a9bdb3">Two people when required</text></g></svg>