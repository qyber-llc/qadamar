# Replica pods: a StatefulSet, because each pod's name is its GATE_NODE_ID and audit chain (gate-replica-0, ...) and its
# volume holds that chain: a pod rescheduled with its volume resumes its chain; one whose volume is lost is refused by
# the database (its stored chain is ahead) and needs a new name (scale up, then retire the old ordinal).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gate-replica
  labels: {app.kubernetes.io/name: gate, app.kubernetes.io/component: replica, app.kubernetes.io/part-of: qadamar}
spec:
  serviceName: gate-replica
  replicas: 2
  revisionHistoryLimit: 5
  podManagementPolicy: Parallel
  updateStrategy: {type: RollingUpdate}
  selector:
    matchLabels: {app.kubernetes.io/name: gate, app.kubernetes.io/component: replica}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gate, app.kubernetes.io/component: replica, app.kubernetes.io/part-of: qadamar}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8787"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: gate, app.kubernetes.io/component: replica}
      # Each pod holds only its own key. This step copies the entry named after the pod from Secret gate-replica-keys
      # (one derived key per replica id, from scripts/ops/replica-key.ts; the group master stays with the Qadamar pods) into a
      # memory volume; the gate container mounts that volume, never the Secret, so it cannot sign as a sibling.
      initContainers:
        - name: replica-key
          image: gate
          imagePullPolicy: IfNotPresent
          command: [node, -e, "const fs = require('node:fs'); fs.copyFileSync('/keys/' + process.env.POD_NAME, '/run/gate-key/key'); fs.chmodSync('/run/gate-key/key', 0o400)"]
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - {name: replica-keys, mountPath: /keys, readOnly: true}
            - {name: replica-key, mountPath: /run/gate-key}
      containers:
        - name: gate
          image: gate
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8787, protocol: TCP}
          env:
            - {name: GATE_PROFILE, value: production}
            - {name: HOST, value: 0.0.0.0}
            - {name: DATA_DIR, value: /var/lib/gate}
            - {name: GATE_NODE_ID, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            # PARAMETER: the Qadamar pods over TLS (they serve it themselves, TLS_CERT_FILE, with a certificate naming this host)
            - {name: GATE_REPLICA_OF, value: "https://gate:8787"}
            - {name: GATE_REPLICA_KEY_FILE, value: /run/gate-key/key}
            - {name: GATE_REPLICA_CA_FILE, value: /etc/gate/replica/ca.pem}
            # PARAMETER: the origin PEPs use (TLS at the ingress), or TLS_CERT_FILE / TLS_KEY_FILE on the pod
            - {name: PUBLIC_ORIGIN, value: "https://pdp.example.invalid"}
            - name: METRICS_TOKEN
              valueFrom: {secretKeyRef: {name: gate-env, key: METRICS_TOKEN}}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 1
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
            timeoutSeconds: 6
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 60
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/gate}
            - {name: tmp, mountPath: /tmp}
            - {name: ca, mountPath: /etc/gate/replica, readOnly: true}
            - {name: replica-key, mountPath: /run/gate-key, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
        - name: replica-key
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: replica-keys
          secret: {secretName: gate-replica-keys, defaultMode: 0440}
        - name: ca
          secret: {secretName: gate-replica, optional: true, defaultMode: 0440, items: [{key: ca.pem, path: ca.pem}]}
  # the local audit chain: durable (fdatasync) before each answer, shipped rows sealed out of it every 10,000
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}} # PARAMETER: size and storageClassName per cloud
---
# PEPs reach the replicas here (or through an ingress in front of it).
apiVersion: v1
kind: Service
metadata:
  name: gate-replica
  labels: {app.kubernetes.io/name: gate, app.kubernetes.io/component: replica}
spec:
  selector: {app.kubernetes.io/name: gate, app.kubernetes.io/component: replica}
  ports:
    - {name: http, port: 8787, targetPort: http, protocol: TCP}
---
# Replicas talk only to the Qadamar pods (feed, audit, forwarding) and kube-dns. Reachable on 8787 from the ingress controller
# and the Prometheus pods, as the Qadamar pods are, and from the namespaces an operator opts in for in-cluster PEPs with
# `kubectl label namespace <ns> qadamar/pep=true` (default deny: no label, no access).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gate-replica
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: gate, app.kubernetes.io/component: replica}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}} # PARAMETER: ingress controller namespace
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}} # PARAMETER: metrics scraper namespace
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
        - namespaceSelector: {matchLabels: {qadamar/pep: 'true'}} # in-cluster PEPs, by explicit namespace opt-in
      ports: [{port: 8787, protocol: TCP}]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: gate, app.kubernetes.io/component: server}}}]
      ports: [{port: 8787, protocol: TCP}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
