# Schema migration, run by the OWNER role (docs/API.md §3.9.1): creates the gate_* tables with forced row-level
# security, then grants the service role the privileges of serviceGrants (append-only audit, anchors and performed
# actions; documents, metadata, sync row and decision tokens) and the backup role SELECT on every gate table
# (backupGrants), both from packages/pdp-http/src/postgres-schema.ts. The server pods never see the owner credentials.
# Jobs are immutable: for an upgrade, delete it and apply again (docs/MANAGED-OFFER.md §6). Idempotent.
apiVersion: batch/v1
kind: Job
metadata:
  name: gate-migrate
  labels: {app.kubernetes.io/name: gate, app.kubernetes.io/component: migrate}
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/name: gate, app.kubernetes.io/component: migrate}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: gate
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: gate
          imagePullPolicy: IfNotPresent
          workingDir: /app/packages/pdp-http
          env:
            - name: OWNER_DATABASE_URL
              valueFrom: {secretKeyRef: {name: gate-db-admin, key: OWNER_DATABASE_URL}}
            - {name: GATE_PROFILE, valueFrom: {configMapKeyRef: {name: gate-config, key: GATE_PROFILE}}}
            - {name: DATABASE_TLS, valueFrom: {configMapKeyRef: {name: gate-config, key: DATABASE_TLS}}}
            - {name: DATABASE_TLS_CA_FILE, valueFrom: {secretKeyRef: {name: gate-postgres-tls, key: DATABASE_TLS_CA_FILE, optional: true}}}
            - {name: DATABASE_TLS_CERT_FILE, valueFrom: {secretKeyRef: {name: gate-postgres-tls, key: DATABASE_TLS_CERT_FILE, optional: true}}}
            - {name: DATABASE_TLS_KEY_FILE, valueFrom: {secretKeyRef: {name: gate-postgres-tls, key: DATABASE_TLS_KEY_FILE, optional: true}}}
            - {name: SERVICE_ROLE, value: gate_app} # PARAMETER if the cloud names roles differently
            - {name: BACKUP_ROLE, value: gate_backup}
          command:
            - node
            - --input-type=module
            - -e
            - |
              import pg from 'pg';
              import { SCHEMA, backupGrants, serviceGrants } from '/app/packages/pdp-http/src/postgres.ts';
              import { databaseTlsFromEnv, postgresClientConfig } from '/app/packages/pdp-http/src/postgres-tls.ts';
              const tls = databaseTlsFromEnv(process.env, 'production');
              const client = new pg.Client(postgresClientConfig(process.env.OWNER_DATABASE_URL, tls, 'production'));
              await client.connect();
              const app = client.escapeIdentifier(process.env.SERVICE_ROLE);
              const backup = client.escapeIdentifier(process.env.BACKUP_ROLE);
              await client.query('BEGIN');
              await client.query(SCHEMA);
              await client.query(serviceGrants(app));
              await client.query(backupGrants(backup));
              await client.query('COMMIT');
              await client.end();
              console.log('Schema migrated; service and backup roles granted.');
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: postgres-tls, mountPath: /etc/gate/postgres, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
        - name: postgres-tls
          secret: {secretName: gate-postgres-tls, optional: true, defaultMode: 0440}
---
# Logical backups (scripts/ops/backup.sh) to a volume. PARAMETER per cloud: where that volume lives. Locally a PVC;
# in a cloud, a bucket mounted through its CSI driver (S3 Mountpoint, GCS FUSE, Azure Blob) or a PVC copied off-site,
# with the bucket's own encryption, versioning and retention lock. The role must bypass RLS (pg_dump refuses otherwise).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gate-backups
  labels: {app.kubernetes.io/name: gate, app.kubernetes.io/component: backup}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi} # PARAMETER
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gate-backup
  labels: {app.kubernetes.io/name: gate, app.kubernetes.io/component: backup}
spec:
  schedule: "17 2 * * *" # PARAMETER: daily, 02:17 in timeZone; the RPO is this interval unless the cloud adds PITR
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels: {app.kubernetes.io/name: gate, app.kubernetes.io/component: backup}
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels: {app.kubernetes.io/name: gate, app.kubernetes.io/component: backup}
        spec:
          restartPolicy: Never
          serviceAccountName: gate
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: backup
              image: gate-ops
              imagePullPolicy: IfNotPresent
              env:
                - name: BACKUP_DATABASE_URL
                  valueFrom: {secretKeyRef: {name: gate-db-admin, key: BACKUP_DATABASE_URL}}
                - {name: GATE_PROFILE, valueFrom: {configMapKeyRef: {name: gate-config, key: GATE_PROFILE}}}
                - {name: DATABASE_TLS, valueFrom: {configMapKeyRef: {name: gate-config, key: DATABASE_TLS}}}
                - {name: DATABASE_TLS_CA_FILE, valueFrom: {secretKeyRef: {name: gate-postgres-tls, key: DATABASE_TLS_CA_FILE, optional: true}}}
                - {name: DATABASE_TLS_CERT_FILE, valueFrom: {secretKeyRef: {name: gate-postgres-tls, key: DATABASE_TLS_CERT_FILE, optional: true}}}
                - {name: DATABASE_TLS_KEY_FILE, valueFrom: {secretKeyRef: {name: gate-postgres-tls, key: DATABASE_TLS_KEY_FILE, optional: true}}}
                # AES-256-GCM key of the archives (scripts/ops/archive-crypt.ts); keep a copy outside the cluster:
                # without it no archive can be restored (docs/MANAGED-OFFER.md §5)
                - name: BACKUP_ENCRYPTION_KEY
                  valueFrom: {secretKeyRef: {name: gate-backup, key: BACKUP_ENCRYPTION_KEY}}
                - {name: BACKUP_RETENTION_DAYS, value: "14"} # PARAMETER
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  export DATABASE_URL="$BACKUP_DATABASE_URL" BACKUP_FILE="/backups/gate-$(date -u +%Y%m%dT%H%M%SZ).dump.gcm"
                  bash /opt/gate/backup.sh
                  find /backups -maxdepth 1 -name 'gate-*.dump.gcm' -mtime "+$BACKUP_RETENTION_DAYS" -print -delete
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                privileged: false
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: "1", memory: 512Mi}
              volumeMounts:
                - {name: backups, mountPath: /backups}
                - {name: tmp, mountPath: /tmp}
                - {name: postgres-tls, mountPath: /etc/gate/postgres, readOnly: true}
          volumes:
            - name: backups
              persistentVolumeClaim: {claimName: gate-backups}
            - name: tmp
              emptyDir: {medium: Memory, sizeLimit: 16Mi}
            - name: postgres-tls
              secret: {secretName: gate-postgres-tls, optional: true, defaultMode: 0440}
