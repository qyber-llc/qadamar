apiVersion: v1
kind: ServiceAccount
metadata:
  name: gate
automountServiceAccountToken: false
---
# Two pods, one active: the pod holding the PostgreSQL advisory lock opens port 8787; the other blocks in listen()
# without a port (packages/pdp-http/src/server.ts). Readiness on /readyz therefore succeeds on the active pod only and
# the Service routes to it alone. The standby is never Ready by design: the Deployment shows 1/2 and never reports a
# completed rollout; watch GateNoActiveNode, not the rollout status.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gate
  labels: {app.kubernetes.io/name: gate, app.kubernetes.io/component: server, app.kubernetes.io/part-of: qadamar}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  # A new pod cannot become Ready while an old active pod holds the lock, so a surge rollout would wait forever.
  # Replacing every pod at once makes an upgrade one controlled failover (docs/MANAGED-OFFER.md §6).
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 100%}
  selector:
    matchLabels: {app.kubernetes.io/name: gate, app.kubernetes.io/component: server}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gate, app.kubernetes.io/component: server, app.kubernetes.io/part-of: qadamar}
      annotations:
        # the scrape job must send Authorization: Bearer <METRICS_TOKEN> (secret gate-env); the standby has no port: up=0 is expected for it
        prometheus.io/scrape: "true"
        prometheus.io/port: "8787"
        prometheus.io/path: /metrics
        prometheus.io/scheme: http
    spec:
      serviceAccountName: gate
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: gate, app.kubernetes.io/component: server}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: gate, app.kubernetes.io/component: server}
      # Signing keys, PEP credentials, accounts, lockouts, the SCIM credential and the SIEM cursor live in PostgreSQL
      # (gate_doc), sealed with SIGNING_KEY_SEAL: both pods share them, DATA_DIR holds only the one-time
      # INITIAL-CREDENTIALS.txt of the first start (new-tenant.sh copies it into a Secret).
      containers:
        - name: gate
          image: gate
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8787, protocol: TCP}
          envFrom:
            - configMapRef: {name: gate-config}
          env:
            - name: DATABASE_URL # the service role: not a superuser, owns nothing (docs/API.md §3.9.1)
              valueFrom: {secretKeyRef: {name: gate-env, key: DATABASE_URL}}
            - {name: DATABASE_TLS_CA_FILE, valueFrom: {secretKeyRef: {name: gate-postgres-tls, key: DATABASE_TLS_CA_FILE, optional: true}}}
            - {name: DATABASE_TLS_CERT_FILE, valueFrom: {secretKeyRef: {name: gate-postgres-tls, key: DATABASE_TLS_CERT_FILE, optional: true}}}
            - {name: DATABASE_TLS_KEY_FILE, valueFrom: {secretKeyRef: {name: gate-postgres-tls, key: DATABASE_TLS_KEY_FILE, optional: true}}}
            - name: SIGNING_KEY_SEAL # PARAMETER per cloud: delivered from the KMS-backed secret store
              valueFrom: {secretKeyRef: {name: gate-env, key: SIGNING_KEY_SEAL}}
            - name: METRICS_TOKEN
              valueFrom: {secretKeyRef: {name: gate-env, key: METRICS_TOKEN}}
            - {name: OIDC_ISSUER, valueFrom: {secretKeyRef: {name: gate-oidc, key: OIDC_ISSUER, optional: true}}}
            - {name: OIDC_CLIENT_ID, valueFrom: {secretKeyRef: {name: gate-oidc, key: OIDC_CLIENT_ID, optional: true}}}
            - {name: OIDC_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: gate-oidc, key: OIDC_CLIENT_SECRET, optional: true}}}
            - {name: OIDC_ROLE_CLAIM, valueFrom: {secretKeyRef: {name: gate-oidc, key: OIDC_ROLE_CLAIM, optional: true}}}
            - {name: OIDC_ID_CLAIM, valueFrom: {secretKeyRef: {name: gate-oidc, key: OIDC_ID_CLAIM, optional: true}}}
            - {name: OIDC_ACR, valueFrom: {secretKeyRef: {name: gate-oidc, key: OIDC_ACR, optional: true}}}
            - {name: TSA_URL, valueFrom: {secretKeyRef: {name: gate-tsa, key: TSA_URL, optional: true}}}
            - {name: TSA_CA_FILE, valueFrom: {secretKeyRef: {name: gate-tsa, key: TSA_CA_FILE, optional: true}}} # e.g. /etc/gate/tsa/ca.pem
            - {name: ANCHOR_INTERVAL, valueFrom: {secretKeyRef: {name: gate-tsa, key: ANCHOR_INTERVAL, optional: true}}}
            # PARAMETER per customer: the https receiver of signed break-glass notices (docs/API.md §3.6.1)
            - {name: BREAK_GLASS_WEBHOOK, valueFrom: {secretKeyRef: {name: gate-break-glass, key: BREAK_GLASS_WEBHOOK, optional: true}}}
            - {name: BREAK_GLASS_WEBHOOK_SECRET, valueFrom: {secretKeyRef: {name: gate-break-glass, key: BREAK_GLASS_WEBHOOK_SECRET, optional: true}}}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 1
            timeoutSeconds: 2
            failureThreshold: 2
          # A standby has no open port, so an HTTP liveness probe would restart it forever. This one requires
          # /healthz to answer when the port is open and accepts a refused connection (standby waiting for the lock).
          # It speaks https when the node serves TLS itself (TLS_CERT_FILE); the peer is the node's own loopback
          # listener, so its certificate is not checked.
          livenessProbe:
            exec:
              command: &alive
                - node
                - -e
                - >-
                  require(process.env.TLS_CERT_FILE ? 'node:https' : 'node:http')
                  .get({host: '127.0.0.1', port: 8787, path: '/healthz', rejectUnauthorized: false, timeout: 4000},
                  (r) => process.exit(r.statusCode === 200 ? 0 : 1))
                  .on('timeout', function () { this.destroy(new Error('timeout')); })
                  .on('error', (e) => process.exit(e.code === 'ECONNREFUSED' ? 0 : 1));
            periodSeconds: 15
            timeoutSeconds: 6
            failureThreshold: 3
          startupProbe:
            exec:
              command: *alive
            periodSeconds: 2
            timeoutSeconds: 6
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 512Mi} # the exec probes start a short-lived node process inside this limit
          volumeMounts:
            - {name: data, mountPath: /var/lib/gate}
            - {name: tmp, mountPath: /tmp}
            - {name: tsa, mountPath: /etc/gate/tsa, readOnly: true}
            - {name: postgres-tls, mountPath: /etc/gate/postgres, readOnly: true}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 64Mi}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
        - name: tsa # ca.pem is read by the node (UID 1000, group 1000 via fsGroup)
          secret: {secretName: gate-tsa, optional: true, defaultMode: 0440}
        - name: postgres-tls # optional private CA and/or client certificate; values are paths in the env above
          secret: {secretName: gate-postgres-tls, optional: true, defaultMode: 0440}
---
apiVersion: v1
kind: Service
metadata:
  name: gate
  labels: {app.kubernetes.io/name: gate, app.kubernetes.io/component: server}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: gate, app.kubernetes.io/component: server}
  ports:
    - {name: http, port: 8787, targetPort: http, protocol: TCP}
---
# The standby is never Ready, so this budget leaves 0 voluntary disruptions for the active pod: a node drain waits
# until an operator moves the active role on purpose (kubectl delete pod <active>), the standby stays evictable.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gate
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels: {app.kubernetes.io/name: gate, app.kubernetes.io/component: server}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gate
spec:
  ingressClassName: nginx # PARAMETER: the cluster's ingress class
  tls:
    - hosts: [tenant.gate.example.invalid] # PARAMETER: tenant host (owner decision on domain names)
      secretName: gate-tls # PARAMETER: certificate Secret (cert-manager or the cloud's certificate service)
  rules:
    - host: tenant.gate.example.invalid # PARAMETER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gate
                port: {name: http}
