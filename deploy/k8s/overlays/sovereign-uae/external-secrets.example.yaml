# NOT RENDERED (kustomization.yaml does not list it): the pattern that fills this overlay's Secrets from an external,
# KMS/HSM-backed, in-country secret store, so no secret value is ever in git, in a script or on a command line.
# Two common patterns, pick one per cluster (owner/provider decision, docs/MANAGED-OFFER.md §12):
#  A. an external-secrets controller (CRD ExternalSecret, below): the controller syncs store entries into Kubernetes
#     Secrets of the tenant namespace; Secret encryption at rest must be on (KMS provider of the API server).
#  B. the Secrets Store CSI driver (CRD SecretProviderClass) with secretObjects, which mirrors mounted entries into
#     Kubernetes Secrets the same way.
# Either needs its CRD and a provider plugin for the chosen store: install, version and store names are PARAMETERS.
# Check the API version your controller serves (`kubectl api-resources | grep -i externalsecret`).
#
# Secrets and keys this overlay references (create all before new-tenant.sh; it checks that they exist):
#   gate-env           DATABASE_URL (service role; no ssl* parameters: DATABASE_TLS=verify-full and gate-postgres-tls decide),
#                      SIGNING_KEY_SEAL (32 random bytes), METRICS_TOKEN (32+ characters)
#   gate-db-admin      OWNER_DATABASE_URL, BACKUP_DATABASE_URL (no ssl* parameters either)
#   gate-postgres-tls  ca.crt: the CA that signed the managed PostgreSQL server certificate, and
#                      DATABASE_TLS_CA_FILE=/etc/gate/postgres/ca.crt (optional mutual TLS: tls.crt, tls.key and
#                      DATABASE_TLS_CERT_FILE / DATABASE_TLS_KEY_FILE naming them under /etc/gate/postgres)
#   gate-backup        BACKUP_ENCRYPTION_KEY (64 hex characters; escrow a copy outside the cluster, in-country)
#   gate-oidc          OIDC_ISSUER, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET, OIDC_ROLE_CLAIM, OIDC_ID_CLAIM, OIDC_ACR (or SAML_*)
#   gate-tsa           TSA_URL, TSA_CA_FILE=/etc/gate/tsa/ca.pem, ca.pem, ANCHOR_INTERVAL
#   gate-break-glass   BREAK_GLASS_WEBHOOK, BREAK_GLASS_WEBHOOK_SECRET
#   gate-siem          SIEM_WEBHOOK_URL, SIEM_HMAC_SECRET (optional: no push without it)
#   gate-pod-tls       tls.crt, tls.key: names gate, gate.<ns>.svc, *.gate-nodes.<ns>.svc, gate-replica, gate-replica.<ns>.svc
#                      (Qadamar pods and replicas; cert-manager or the store)
#   gate-tls           the Ingress certificate of the tenant host
#   gate-replica       GATE_REPLICA_KEYS, ca.pem (the CA of gate-pod-tls); gate-replica-keys: one key per replica ordinal
#                      up to the HPA's maxReplicas (scripts/ops/replica-key.ts)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gate-env
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: in-country-store} # PARAMETER: the store backed by the in-country KMS/HSM
  target:
    name: gate-env
    creationPolicy: Owner
  data:
    # PARAMETER: the store's key names for this tenant
    - {secretKey: DATABASE_URL, remoteRef: {key: gate/<tenant>/database-url}}
    - {secretKey: SIGNING_KEY_SEAL, remoteRef: {key: gate/<tenant>/signing-key-seal}}
    - {secretKey: METRICS_TOKEN, remoteRef: {key: gate/<tenant>/metrics-token}}
