// ---- scenes: (p = progress 0..1, lt = seconds into scene, t = global seconds) ----

  intro(p, lt, t) {

  engine(p) {
    const stages = ['REQUEST', 'SUBJECT', 'ROLE', 'CLASSIFICATION', 'NEED-TO-KNOW', 'POLICY', 'CONTEXT', 'CERTIFIED CMD', 'SEPARATION'];
    const x0 = 220, dx = 185, y = 470, start = x0 - 60, end = x0 + dx * 8 + 60, stopAt = 4, stopX = x0 + dx * stopAt - 36;
    let s = `<path d="M${start} ${y} H${end}" stroke="${C.line2}" stroke-width="2"/>` + stream(start, y, end, y, C.ice, k(p, 0.04, 0.1) * 0.5);
    const a = cl((p - 0.08) / 0.34), b = cl((p - 0.5) / 0.3);
    const ax = L(start, end, a), bx = Math.min(L(start, end, b), stopX), failed = b > 0 && bx >= stopX - 0.5;
    const tFail = 0.5 + 0.3 * (stopX - start) / (end - start);
    stages.forEach((name, i) => {
      const x = x0 + i * dx, u = ko(p, 0.01 + i * 0.012, 0.08 + i * 0.012);
      const lit = (a > 0 && p < 0.5 && ax >= x) || (b > 0 && i < stopAt && bx >= x);
      const col = failed && i === stopAt ? C.no : lit ? C.ok : C.line2;
      s += `<g ${popAt(x, y, u)}>${hexNode(x, y, 30, col, col !== C.line2)}` +
        tx(x, y + 7, 18, pad(i + 1), { m: 1, a: 'middle', fill: col === C.line2 ? C.dim : col, w: 700 }) +

    s += tx(960, 690, 20, 'Mandatory stages run before tenant policy, which cannot reorder or switch them off.', { a: 'middle', fill: C.dim, op: k(p, 0.12, 0.25) });
    return s;
  },
  government(p) {
    let s = panel(120, 190, 980, 640, p, 0, 'ARCHIVE SEARCH');
    const q = 'case files  ·  all levels';
    s += `<g opacity="${k(p, 0.04, 0.1)}"><rect x="150" y="270" width="920" height="54" rx="8" fill="rgba(255,255,255,.03)" stroke="${C.line2}"/>` +
      `<circle cx="180" cy="297" r="9" fill="none" stroke="${C.dim}" stroke-width="2"/><path d="M187 304 l8 8" stroke="${C.dim}" stroke-width="2"/>` +

    const hide3 = k(p, 0.36, 0.46), close = k(p, 0.46, 0.53), cap = k(p, 0.68, 0.78);
    let yy = 352;
    rows.forEach(([lvl, comp, title], i) => {
      const appear = ko(p, 0.14 + i * 0.025, 0.2 + i * 0.025);
      const h = lvl === 3 ? 60 * (1 - close) : 60, locked = (lvl === 2 || comp) && lvl !== 3;
      if (appear > 0 && h > 1) {
        const tx0 = comp ? 360 : 240;
        if (lvl === 3 && hide3 > 0) {                                       // L3 rows disintegrate into slices
          for (let j = 0; j < 30; j++) {

          }

        } else {
          const dim = locked ? 1 - cap * 0.7 : 1;
          s += `<g ${reveal(appear, 12)}><g opacity="${dim}"><rect x="150" y="${yy}" width="920" height="${h - 8}" rx="6" fill="rgba(255,255,255,.025)" stroke="${lvl === 3 ? C.no : C.line}" stroke-opacity="${lvl === 3 ? 0.5 : 1}"/>` +
            (h > 40 ? pill(170, yy + 32, `L${lvl}`, lvl === 3 ? C.no : C.ice, 1, 16) + (comp ? pill(232, yy + 32, comp, C.dim, 1, 14) : '') +
              tx(tx0, yy + 38, 18, title, { fill: lvl === 3 ? C.no : C.text }) + tx(1050, yy + 37, 14, lvl === 3 ? 'L3' : 'released', { m: 1, a: 'end', fill: C.faint }) : '') + `</g>` +
            (locked && cap > 0.2 ? `<g transform="translate(1000 ${yy + 26})" opacity="${cap}"><rect x="-10" y="-4" width="20" height="16" rx="3" fill="${C.amber}"/><path d="M-6 -4 v-5 a6 6 0 0 1 12 0 v5" fill="none" stroke="${C.amber}" stroke-width="2.5"/></g>` : '') + `</g>`;
        }
      }
      yy += h;
    });
    s += tx(150, 800, 16, scramble('L3 results are never released: not even their titles or count.', k(p, 0.44, 0.56)), { m: 1, fill: C.no, op: 1 - cap });
    s += tx(150, 800, 16, scramble('Untrusted network: only levels allowed off-network stay reachable.', cap), { m: 1, fill: C.amber });
    s += panel(1160, 190, 640, 640, p, 0.05, 'SUBJECT');
    s += role(1200, 300, 'Analyst', 'clearance L2 · C-ARGUS', ko(p, 0.08, 0.18));
    const net = cap > 0.5, sw = cap;
    s += tx(1200, 410, 16, 'NETWORK', { m: 1, fill: C.dim, ls: 2, op: k(p, 0.1, 0.2) });
    s += `<g opacity="${k(p, 0.1, 0.2)}"><rect x="1200" y="428" width="76" height="38" rx="19" fill="${net ? C.amber : C.ok}" fill-opacity=".18" stroke="${net ? C.amber : C.ok}"/>` +
      `<circle cx="${L(1219, 1257, sw)}" cy="447" r="13" fill="${net ? C.amber : C.ok}" filter="url(#glow)"/></g>` + tx(1296, 454, 20, net ? 'untrusted' : 'trusted', { m: 1, fill: net ? C.amber : C.ok, op: k(p, 0.1, 0.2) });
    s += tx(1200, 520, 16, 'REACHABLE LEVEL', { m: 1, fill: C.dim, ls: 2, op: k(p, 0.12, 0.22) });
    const reach = L(2, 1, cap);
    for (let i = 0; i < 4; i++) {
      const lvl = 3 - i, on = lvl <= reach + 0.01, u = ko(p, 0.12 + i * 0.02, 0.22 + i * 0.02);

    s += role(220, 560, 'Officer A', 'maker', ko(p, 0.04, 0.12));

  healthcare(p, lt) {

    s += panel(170, 560, 560, 270, p, 0.36, 'EMERGENCY ACCESS', C.amber);
    const g = ko(p, 0.38, 0.46);
    if (g > 0) {
      const hit = cl((p - 0.52) / 0.06);
      s += `<g ${reveal(g, 10)}><rect x="200" y="640" width="500" height="46" rx="6" fill="rgba(255,255,255,.03)" stroke="${C.line2}"/>` +

        `<rect x="200" y="706" width="200" height="50" rx="8" fill="${C.amber}" fill-opacity="${p > 0.52 ? 0.28 : 0.1}" stroke="${C.amber}"${p > 0.52 ? ' filter="url(#glow)"' : ''}/>` + tx(300, 738, 17, 'BREAK GLASS', { m: 1, a: 'middle', fill: C.amber, w: 700 }) + `</g>`;
      if (hit > 0) {                                                  // glass crack and shards
        for (let i = 0; i < 9; i++) { const a = i * 0.7 + hash(i) * 0.5, len = 26 + 44 * hash(i + 3); s += `<path d="M300 731 L${300 + Math.cos(a) * len * cl(hit * 4)} ${731 + Math.sin(a) * len * 0.6 * cl(hit * 4)}" stroke="#fff" stroke-width="1.4" opacity="${0.8 * (1 - hit)}"/>`; }
        for (let i = 0; i < 10; i++) { const a = hash(i + 20) * 6.28, d = eo(hit) * (60 + 70 * hash(i + 30)); s += `<polygon points="0,-5 5,4 -4,3" transform="translate(${300 + Math.cos(a) * d} ${731 + Math.sin(a) * d}) rotate(${hit * 400 * hash(i)})" fill="${C.amber}" opacity="${1 - hit}"/>`; }
      }
      const ringU = cl((p - 0.55) / 0.45), r = 34, a = 2 * Math.PI * (1 - ringU * 0.25);
      if (p > 0.55) s += `<g transform="translate(470 731)"><circle r="${r}" fill="none" stroke="${C.line2}" stroke-width="5"/><path d="M0 ${-r} A${r} ${r} 0 ${a > Math.PI ? 1 : 0} 1 ${r * Math.sin(a)} ${-r * Math.cos(a)}" fill="none" stroke="${C.amber}" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/></g>` + tx(520, 737, 17, '≤ 4 h', { m: 1, fill: C.amber });
      const bell = k(p, 0.7, 0.76);
      s += `<g opacity="${bell}" transform="translate(630 731)"><path d="M-12 8 V-2 a12 12 0 0 1 24 0 V8 l4 4 h-32 z" fill="none" stroke="${C.amber}" stroke-width="2.5"/><circle cy="16" r="3" fill="${C.amber}"/>` +
        `<circle r="${20 + (lt * 30) % 18}" fill="none" stroke="${C.amber}" opacity="${0.6 - ((lt * 30) % 18) / 30}"/></g>` + tx(200, 800, 15, scramble('alert sent  ·  never for yourself  ·  no clearance added', bell), { m: 1, fill: C.dim });
    }
    s += flow(730, 700, 900, 635, k(p, 0.55, 0.62), C.amber, true);
    s += verdict(1390, 635, true, ko(p, 0.6, 0.65));
    s += role(1400, 800, 'Reviewer', 'another person · pending', ko(p, 0.84, 0.9), C.amber);
    return s;
  },
  crm(p) {
    let s = '';
    const RX = 690, RY = 140, RW = 540, broken = k(p, 0.68, 0.72);
    const F = [['client', 'Client account'], ['scope', 'Platform rollout, phase 2'], ['milestones', 'Design · Build · Go-live'], ['total value'], ['day rate'], ['margin']];
    s += panel(RX, RY, RW, 390, p, 0, 'CONTRACT · STORED RECORD');
    F.forEach(([name, val], i) => {
      const u = ko(p, 0.04 + i * 0.02, 0.1 + i * 0.02), y = RY + 98 + i * 46;
      if (u <= 0) return;
      s += `<g ${reveal(u, 10)}>` + tx(RX + 26, y, 15, name, { m: 1, fill: C.faint }) +
        (val ? tx(RX + 170, y, 17, type(val, k(p, 0.05 + i * 0.02, 0.14 + i * 0.02))) : blocks(RX + 170, y, C.amber, 0.5)) + `</g>`;
      if (!val) {
        s += pill(RX + 340, y - 2, 'finance.amount', C.amber, ko(p, 0.12 + i * 0.01, 0.17 + i * 0.01) * (1 - broken), 13);
        s += pill(RX + 340, y - 2, 'untagged', C.no, ko(p, 0.7 + i * 0.01, 0.74 + i * 0.01), 13);
      }
    });
    // enforcement point (SDK / gateway) between the record and the readers
    const EX = 960, EY = 640, eu = ko(p, 0.12, 0.2), red = k(p, 0.78, 0.8);
    s += flow(EX, RY + 390, EX, EY - 50, k(p, 0.14, 0.2), C.line2) + stream(EX, RY + 390, EX, EY - 50, C.ice, k(p, 0.2, 0.24) * (1 - red));
    if (eu > 0) s += `<g ${popAt(EX, EY, eu)}><circle cx="${EX}" cy="${EY}" r="90" fill="url(#${red > 0.5 ? 'coreRed' : 'core'})"/>${hexNode(EX, EY, 50, red > 0.5 ? C.no : C.ok, true)}` +
      tx(EX, EY + 6, 16, 'PEP', { m: 1, a: 'middle', fill: red > 0.5 ? C.no : C.ok, w: 700, ls: 3 }) + tx(EX, EY + 82, 14, 'gateway / SDK', { m: 1, a: 'middle', fill: C.dim }) + `</g>`;
    s += ring(EX, EY, cl((p - 0.79) / 0.1), C.no, 50, 170);
    const view = (x, title, roleTxt, col, a, masked) => {
      let v = panel(x, 540, 500, 300, p, a, title, col);
      v += pill(x + 26, 626, roleTxt, col, ko(p, a + 0.03, a + 0.08), 14);
      F.forEach(([name, val], i) => {
        const u = ko(p, a + 0.1 + i * 0.015, a + 0.15 + i * 0.015), y = 672 + i * 28;
        if (u <= 0) return;
        v += `<g ${reveal(u, 8)}>` + tx(x + 26, y, 14, name, { m: 1, fill: C.faint });
        if (val) v += tx(x + 170, y, 15, val);
        else if (masked) v += tx(x + 170, y, 15, scramble('[MASKED]', cl(u * 1.2)), { m: 1, fill: C.amber, w: 700 }) +
          `<g transform="translate(${x + 290} ${y - 5})" opacity="${u}"><path d="M-10 0 Q0 -8 10 0 Q0 8 -10 0 Z" fill="none" stroke="${C.amber}" stroke-width="1.6"/><path d="M-9 7 L9 -7" stroke="${C.amber}" stroke-width="1.6"/></g>`;
        else v += blocks(x + 170, y + 1, C.ok, 0.75);
        v += `</g>`;
      });
      return v;
    };
    // project manager: permitted, amounts masked
    s += view(110, 'PROJECT MANAGER · VIEW', 'roles: project_manager', C.ice, 0.18, true);
    s += flow(610, 690, EX - 60, EY + 20, k(p, 0.2, 0.24), C.line2);
    s += mover((v) => [L(EX - 60, 610, ss(v)), L(EY + 20, 690, ss(v))], cl((p - 0.24) / 0.06), 'mask finance.amount', C.amber);
    s += pill(640, 600, 'ABAC.CONTENT_MASK', C.amber, ko(p, 0.26, 0.3) * (1 - k(p, 0.66, 0.7)), 13);
    // finance approver: permitted, nothing masked
    s += view(1310, 'FINANCE APPROVER · VIEW', 'roles: finance_approver', C.ok, 0.42, false);
    s += flow(EX + 60, EY + 20, 1310, 690, k(p, 0.44, 0.48), C.line2);
    s += mover((v) => [L(EX + 60, 1310, ss(v)), L(EY + 20, 690, ss(v))], cl((p - 0.48) / 0.06), 'no mask', C.ok);
    // the mask cannot be applied: nothing is released
    s += mover((v) => [L(610, EX - 60, v), L(720, EY + 30, v)], cl((p - 0.72) / 0.07), 'read · contract', C.ice);
    const nr = ko(p, 0.8, 0.86);
    if (nr > 0) s += `<g opacity="${nr}"><rect x="110" y="540" width="500" height="300" rx="10" fill="${C.bg}" fill-opacity=".95"/>` +
      `<rect x="110" y="540" width="500" height="300" rx="10" fill="none" stroke="${C.no}" stroke-opacity=".7" stroke-width="1.5"/></g>` +
      tx(360, 676, 22, scramble('NO RECORD RELEASED', nr), { m: 1, a: 'middle', fill: C.no, w: 700, ls: 2 }) +
      tx(360, 712, 15, scramble('the mask cannot be applied', k(p, 0.83, 0.92)), { m: 1, a: 'middle', fill: C.dim });
    s += verdict(EX, EY + 150, false, ko(p, 0.8, 0.86), 'obligation_unenforceable');
    return s;
  },
  governance(p, lt) {
    let s = panel(120, 190, 520, 400, p, 0.01, 'RULE CHANGE');
    const diff = [[' ', 'rule  pm-contract-read'], ['-', 'actions  read, export'], ['+', 'actions  read'], [' ', 'when  role = project_manager'], ['+', 'mask  finance.amount'], [' ', 'scope  tenant']];
    diff.forEach(([d, line], i) => {
      const u = ko(p, 0.04 + i * 0.015, 0.1 + i * 0.015), col = d === '+' ? C.ok : d === '-' ? C.no : C.dim, y = 280 + i * 44;
      if (u <= 0) return;
      s += `<g ${reveal(u, 8)}>` + (d !== ' ' ? `<rect x="146" y="${y - 22}" width="468" height="32" rx="4" fill="${col}" opacity=".09"/>` : '') +
        tx(156, y, 17, d, { m: 1, fill: col, w: 700 }) + tx(184, y, 17, type(line, cl(u * 1.4)), { m: 1, fill: d === ' ' ? C.dim : C.text }) + `</g>`;
    });
    s += panel(680, 190, 520, 400, p, 0.12, 'IMPACT PREVIEW');
    const im = k(p, 0.16, 0.26), ROWS = [['gain access', C.ok, 0.35], ['lose access', C.no, 0.6], ['obligations changed', C.ice, 0.2]];
    ROWS.forEach(([lab, col, w], i) => {
      s += tx(710, 290 + i * 90, 17, lab, { m: 1, fill: col, op: im }) + `<rect x="710" y="${306 + i * 90}" width="460" height="14" rx="7" fill="${C.line}" opacity="${im}"/>` +
        `<rect x="710" y="${306 + i * 90}" width="${460 * im * w}" height="14" rx="7" fill="${col}" opacity=".65"/>`;
    });
    s += role(1250, 260, 'Author', 'proposes', ko(p, 0.03, 0.12));
    s += verdict(1700, 260, false, ko(p, 0.34, 0.4) * (1 - k(p, 0.45, 0.48)), 'own change');
    s += role(1250, 400, 'Approver', 'second person', ko(p, 0.44, 0.5), C.ok);
    s += verdict(1700, 400, true, ko(p, 0.5, 0.55));
    s += tx(1250, 520, 16, scramble('published  ·  two-person rule satisfied', k(p, 0.52, 0.6)), { m: 1, fill: C.ok });
    s += panel(120, 630, 1680, 200, p, 0.58, 'AUDIT CHAIN');
    const ch = ko(p, 0.6, 0.68), scroll = lt * 22;
    if (ch > 0) {
      const sweep = k(p, 0.78, 0.92);
      for (let i = 0; i < 10; i++) {
        const n = i + Math.floor(scroll / 190), x = 160 + i * 190 - (scroll % 190);
        if (x < 130 || x > 1640) continue;
        const hx = [...Array(8)].map((_, j) => '0123456789abcdef'[Math.floor(hash(n * 17 + j) * 16)]).join('');
        const verified = sweep > 0 && x < L(140, 1640, sweep);
        s += `<g opacity="${ch}"><rect x="${x}" y="700" width="150" height="100" rx="6" fill="rgba(255,255,255,.03)" stroke="${verified ? C.ok : C.line2}"/>` +
          tx(x + 16, 730, 13, 'decision', { m: 1, fill: C.dim }) + tx(x + 16, 756, 13, 'prev ' + hx.slice(0, 6), { m: 1, fill: C.faint }) +
          tx(x + 16, 784, 13, '# ' + hx, { m: 1, fill: C.ok }) + `<path d="M${x + 150} 750 H${x + 190}" stroke="${C.ok}" stroke-width="2" opacity=".6"/></g>`;
      }
      if (sweep > 0 && sweep < 1) s += `<rect x="${L(140, 1640, sweep) - 120}" y="690" width="120" height="120" fill="url(#trailG)"/><rect x="${L(140, 1640, sweep)}" y="690" width="5" height="120" fill="${C.ok}" filter="url(#glow)"/>`;
      s += pill(1560, 668, 'RFC 3161 anchor', C.ice, ko(p, 0.66, 0.72), 14);
    }
    return s;
  },
  outro(p, lt, t) {
    let s = engineCore(960, 390, 0.9, t, ko(p, 0, 0.15));
    const word = 'Qadamar';
    s += `<text x="960" y="640" font-size="92" font-weight="600" text-anchor="middle" letter-spacing="1" fill="${C.text}">` +
      [...word].map((ch, i) => `<tspan opacity="${eo(cl((p - 0.08 - i * 0.012) / 0.12))}">${esc(ch)}</tspan>`).join('') + `</text>`;
    const sw = cl((p - 0.24) / 0.2);
    if (sw > 0 && sw < 1) s += `<rect x="${L(560, 1360, sw) - 60}" y="560" width="120" height="100" fill="url(#sheen)" transform="skewX(-18)" transform-origin="960 600"/>`;
    s += `<g ${reveal(ko(p, 0.2, 0.38))}>` + tx(960, 710, 30, 'Self-hosted access control for regulated organisations.', { a: 'middle', fill: C.dim, w: 300 }) + `</g>`;
    ['government', 'banking', 'healthcare', 'enterprise'].forEach((key, i) => {
      s += `<g opacity="${k(p, 0.3 + i * 0.05, 0.45 + i * 0.05) * 0.8}" transform="translate(${780 + i * 120} 820) scale(.42)">${ICON[key](C.dim)}</g>`;
    });
    s += tx(960, 1010, 17, 'Illustrative scenarios, not customers. Every behaviour shown exists in version 0.12.2 (pre-1.0).', { a: 'middle', fill: C.faint, op: k(p, 0.4, 0.55), m: 1 });
    return s;
  },
};

if (!window.__BUILD__) {
  setTimes(Object.keys(SCENES).map((id, i) => ({ id, start: i * 14, dur: 14 })));
