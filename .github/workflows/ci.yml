# Runs on GitHub-hosted Linux unless the repository variable CI_RUNNER names another runner. See docs/CI.md.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One live run per ref; main is exempt so every commit that lands there is tested.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Lean 4 model of the decision core (formal/, docs/spec/FORMAL-MODEL.md): the proofs are checked (no sorry, standard
  # axioms only), then evaluate is tested against the executable model. Its own job with a read-only token: it downloads
  # and runs a third-party toolchain, so nothing it runs holds more than read access (as in release.yml). Not in
  # tools/ci/checks.sh, which local.sh runs offline and where the differential test skips without Lean.
  formal:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: macOS paths
        if: runner.os == 'macOS'
        run: |
          echo /Applications/Docker.app/Contents/Resources/bin >> "$GITHUB_PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: What changed
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash tools/ci/docs-only.sh
      - name: Lean toolchain (elan and Lean, each pinned by version and SHA-256)
        if: steps.paths.outputs.docs_only != 'true'
        run: bash tools/ci/install-lean.sh
      - name: Formal model (lake build, proofs checked, no sorry)
        if: steps.paths.outputs.docs_only != 'true'
        run: bash formal/check.sh
      - name: Differential test, TypeScript evaluate against the Lean model
        if: steps.paths.outputs.docs_only != 'true'
        env:
          LEAN_REQUIRED: '1'
          LEAN_DIFF_RUNS: '10000'
        run: node --test packages/core/test/lean-differential.test.ts
  ci:
    needs: formal
    permissions:
      contents: read
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    outputs:
      docs_only: ${{ steps.paths.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: macOS paths
        if: runner.os == 'macOS'
        run: |
          echo /Applications/Docker.app/Contents/Resources/bin >> "$GITHUB_PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - name: What changed
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash tools/ci/docs-only.sh
      - name: Secret scan (gitleaks, full history)
        run: |
          bash tools/ci/install-gitleaks.sh
          "$GITHUB_WORKSPACE/.ci-bin/gitleaks" git --no-banner --redact .
      - name: Install
        if: steps.paths.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile
      # needs the registry, so here and not in tools/ci/checks.sh (which local.sh runs offline); docs/CI.md
      - name: Dependency vulnerability scan (production dependencies, high and critical block)
        if: steps.paths.outputs.docs_only != 'true'
        run: pnpm audit --prod --audit-level high
      # SAST over the TypeScript sources (tests and fixtures excluded by .semgrepignore). It pulls the pinned Semgrep image
      # and the registry rulesets, so it runs here and not in tools/ci/checks.sh (which local.sh runs offline); docs/CI.md
      - name: SAST (Semgrep, ERROR findings block)
        if: steps.paths.outputs.docs_only != 'true'
        env:
          SEMGREP_IMAGE: semgrep/semgrep:1.95.0@sha256:30e6afa99ebd8e7b4115d4904898108eb4bf77025819e9263f09cf14e6f6e549
        run: >-
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE"
          semgrep scan --metrics off --disable-version-check
          --config p/javascript --config p/typescript --config p/nodejsscan
          --severity ERROR --error
      - name: Throwaway PostgreSQL
        if: steps.paths.outputs.docs_only != 'true'
        env:
          CI_DB_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: bash tools/ci/postgres.sh start
      - name: Provide pinned Playwright and Chromium (read-only token)
        if: steps.paths.outputs.docs_only != 'true'
        env:
          CI_CHROMIUM_SHA256: ${{ vars.CI_CHROMIUM_SHA256 }}
        run: node tools/ci/install-playwright.ts
      - name: Checks
        if: steps.paths.outputs.docs_only != 'true'
        run: bash tools/ci/checks.sh
      - name: Remove the throwaway PostgreSQL
        if: always() && steps.paths.outputs.docs_only != 'true'
        env:
          CI_DB_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: bash tools/ci/postgres.sh stop

  image-scan:
    needs: [formal, ci]
    if: needs.ci.outputs.docs_only != 'true'
    permissions:
      contents: read
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: macOS paths
        if: runner.os == 'macOS'
        run: |
          echo /Applications/Docker.app/Contents/Resources/bin >> "$GITHUB_PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
      - name: Build release image
        run: docker build --tag "gate-release:${GITHUB_SHA}" .
      - name: Export release image
        run: docker save --output gate-release.tar "gate-release:${GITHUB_SHA}"
      - name: Container vulnerability scan (Trivy, fixable HIGH/CRITICAL block)
        env:
          TRIVY_IMAGE: aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08
        run: >-
          docker run --rm
          -v "$PWD/gate-release.tar:/tmp/gate-release.tar:ro"
          "$TRIVY_IMAGE" image
          --input /tmp/gate-release.tar
          --scanners vuln
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          --no-progress
      - name: Build ops image
        run: docker build --target ops --tag "gate-ops:${GITHUB_SHA}" .
      - name: Ops image backup and restore drill
        run: bash tools/ci/ops-image-drill.sh "gate-release:${GITHUB_SHA}" "gate-ops:${GITHUB_SHA}"
      - name: Export ops image
        run: docker save --output gate-ops.tar "gate-ops:${GITHUB_SHA}"
      - name: Ops image vulnerability scan (Trivy, fixable HIGH/CRITICAL block)
        env:
          TRIVY_IMAGE: aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08
        run: >-
          docker run --rm
          -v "$PWD/gate-ops.tar:/tmp/gate-ops.tar:ro"
          "$TRIVY_IMAGE" image
          --input /tmp/gate-ops.tar
          --scanners vuln
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          --no-progress
